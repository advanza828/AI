    // 构建问卷：全部展开，每个要求项不再显示额外标记
    function buildSurvey() {
        const container = document.getElementById('survey-container');
        container.innerHTML = '';
        for (let domain in assessmentData) {
            const domainCard = document.createElement('div');
            domainCard.className = 'card';
            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<i class="fas fa-folder-open"></i> ${domain}能力域`;
            const bodyDiv = document.createElement('div');
            bodyDiv.className = 'card-body';
            domainCard.appendChild(header);
            domainCard.appendChild(bodyDiv);

            for (let sub in assessmentData[domain]) {
                const subBlock = document.createElement('div');
                subBlock.className = 'subdomain-block';
                const subTitle = document.createElement('div');
                subTitle.className = 'subdomain-title';
                subTitle.innerHTML = `<span><strong>${sub}</strong></span>`;
                const reqDiv = document.createElement('div');
                reqDiv.className = 'level-requirements';
                const levels = assessmentData[domain][sub].levels;
                const levelOrder = ['L1', 'L2', 'L3', 'L4', 'L5'];
                for (let lvl of levelOrder) {
                    if (!levels[lvl]) continue;
                    const group = document.createElement('div');
                    group.className = 'level-group';
                    const badge = document.createElement('div');
                    badge.className = 'level-badge';
                    badge.innerText = lvl;
                    group.appendChild(badge);
                    levels[lvl].forEach((reqText, idx) => {
                        const reqItem = document.createElement('div');
                        reqItem.className = 'requirement-item';
                        const reqSpan = document.createElement('div');
                        reqSpan.className = 'req-text';
                        reqSpan.innerText = reqText;
                        const radioGroup = document.createElement('div');
                        radioGroup.className = 'rating-group';
                        const options = [
                            { val: 1, label: '全部满足' },
                            { val: 0.8, label: '超半数满足' },
                            { val: 0.5, label: '部分满足' },
                            { val: 0, label: '不满足' }
                        ];
                        const name = `${domain}|${sub}|${lvl}|${idx}`;
                        options.forEach(opt => {
                            const label = document.createElement('label');
                            const radio = document.createElement('input');
                            radio.type = 'radio';
                            radio.name = name;
                            radio.value = opt.val;
                            label.appendChild(radio);
                            label.appendChild(document.createTextNode(opt.label));
                            radioGroup.appendChild(label);
                        });
                        reqItem.appendChild(reqSpan);
                        reqItem.appendChild(radioGroup);
                        group.appendChild(reqItem);
                    });
                    reqDiv.appendChild(group);
                }
                subBlock.appendChild(subTitle);
                subBlock.appendChild(reqDiv);
                bodyDiv.appendChild(subBlock);
            }
            container.appendChild(domainCard);
        }
    }

    // 检查所有必选项是否已选，返回缺失项列表
    function getMissingItems() {
        const missing = [];
        const allRadios = document.querySelectorAll('input[type="radio"]');
        const nameSet = new Set();
        allRadios.forEach(radio => { nameSet.add(radio.name); });
        for (let name of nameSet) {
            const checked = document.querySelector(`input[name="${name}"]:checked`);
            if (!checked) {
                const parts = name.split('|');
                if (parts.length === 4) {
                    const domain = parts[0];
                    const sub = parts[1];
                    const level = parts[2];
                    const reqIdx = parseInt(parts[3]);
                    const reqText = assessmentData[domain]?.[sub]?.levels?.[level]?.[reqIdx];
                    missing.push({
                        domain, sub, level,
                        text: reqText || `要求 ${level}-${reqIdx+1}`,
                        name: name
                    });
                } else {
                    missing.push({ name, text: '未命名要求' });
                }
            }
        }
        return missing;
    }

    // 获取所有评分
    function calculateScores() {
        let rawScores = {};
        for (let domain in assessmentData) {
            rawScores[domain] = {};
            for (let sub in assessmentData[domain]) {
                rawScores[domain][sub] = { L1: null, L2: null, L3: null, L4: null, L5: null };
                const levels = ['L1', 'L2', 'L3', 'L4', 'L5'];
                for (let lvl of levels) {
                    const reqs = assessmentData[domain][sub].levels[lvl];
                    if (!reqs) continue;
                    let sum = 0, count = 0;
                    for (let idx = 0; idx < reqs.length; idx++) {
                        const radioName = `${domain}|${sub}|${lvl}|${idx}`;
                        const selected = document.querySelector(`input[name="${radioName}"]:checked`);
                        if (selected) {
                            sum += parseFloat(selected.value);
                            count++;
                        } else {
                            // 漏选不会进入此分支（因为提交前已拦截），但防御性处理
                            sum += 0;
                            count++;
                        }
                    }
                    const avg = count > 0 ? sum / count : 0;
                    rawScores[domain][sub][lvl] = avg;
                }
            }
        }
        return rawScores;
    }

    function computeTotalGrade(scores) {
        const domains = ['资源', '应用', '管理', '效益'];
        const domainWeight = 0.25;
        let levelTotalScore = { L1: 0, L2: 0, L3: 0, L4: 0, L5: 0 };
        for (let domain of domains) {
            let subList = Object.keys(assessmentData[domain]);
            let subWeight = 1.0 / subList.length;
            for (let lvl of ['L1', 'L2', 'L3', 'L4', 'L5']) {
                let domainLevelSum = 0;
                for (let sub of subList) {
                    let subScore = (scores[domain][sub][lvl] !== undefined && scores[domain][sub][lvl] !== null) ? scores[domain][sub][lvl] : 0;
                    domainLevelSum += subScore * subWeight;
                }
                levelTotalScore[lvl] += domainLevelSum * domainWeight;
            }
        }
        let finalScore = levelTotalScore.L1 + levelTotalScore.L2 + levelTotalScore.L3 + levelTotalScore.L4 + levelTotalScore.L5;
        let grade = "";
        if (finalScore >= 4) grade = "L5 推广级";
        else if (finalScore >= 3) grade = "L4 企业级";
        else if (finalScore >= 2) grade = "L3 协同级";
        else if (finalScore >= 1) grade = "L2 应用级";
        else grade = "L1 起始级";
        return { finalScore, grade, levelDetails: levelTotalScore };
    }

    function renderRadar(scores) {
        const domains = ['资源', '应用', '管理', '效益'];
        const domainScores = {};
        for (let d of domains) {
            let total = 0;
            let subCount = Object.keys(assessmentData[d]).length;
            for (let sub in assessmentData[d]) {
                let subAvg = 0;
                let cnt = 0;
                for (let lvl of ['L1', 'L2', 'L3', 'L4', 'L5']) {
                    let val = scores[d][sub][lvl];
                    if (val !== undefined) { subAvg += val; cnt++; }
                }
                let finalSub = cnt > 0 ? subAvg / cnt : 0;
                total += finalSub;
            }
            domainScores[d] = subCount > 0 ? total / subCount : 0;
        }
        const ctx = document.getElementById('radarChart').getContext('2d');
        if (window.radarChartInstance) window.radarChartInstance.destroy();
        window.radarChartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: domains,
                datasets: [{
                    label: '各能力域综合成熟度 (0~1)',
                    data: domains.map(d => domainScores[d]),
                    backgroundColor: 'rgba(44,125,160,0.2)',
                    borderColor: '#2c7da0',
                    pointBackgroundColor: '#1f6e8c',
                    pointBorderColor: '#fff'
                }]
            },
            options: { scales: { r: { min: 0, max: 1, ticks: { stepSize: 0.2 } } } }
        });
        return domainScores;
    }

    function showResults() {
        // 检查漏选
        const missing = getMissingItems();
        if (missing.length > 0) {
            let msg = `您有 ${missing.length} 项评估要求未选择，请完成所有必选项后再提交。\n`;
            const sample = missing.slice(0, 5);
            sample.forEach(m => {
                msg += `- ${m.domain} / ${m.sub} / ${m.level} : ${m.text.substring(0, 60)}...\n`;
            });
            if (missing.length > 5) msg += `... 等共${missing.length}项未选。`;
            alert(msg);
            // 滚动到第一个未选项
            const firstName = missing[0].name;
            const firstRadio = document.querySelector(`input[name="${firstName}"]`);
            if (firstRadio) {
                firstRadio.scrollIntoView({ behavior: 'smooth', block: 'center' });
                firstRadio.parentElement.style.backgroundColor = '#fff0f0';
                setTimeout(() => { firstRadio.parentElement.style.backgroundColor = ''; }, 2000);
            }
            return;
        }

        const scores = calculateScores();
        const { finalScore, grade, levelDetails } = computeTotalGrade(scores);
        const domainScores = renderRadar(scores);
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('levelText').innerHTML = `就绪度等级：${grade} &nbsp; <span style="font-size:1rem;">总分: ${finalScore.toFixed(2)} / 5</span>`;
        let detailHtml = `<div class="summary-score"><strong>各等级累计得分:</strong><br> L1: ${levelDetails.L1.toFixed(2)} | L2: ${levelDetails.L2.toFixed(2)} | L3: ${levelDetails.L3.toFixed(2)} | L4: ${levelDetails.L4.toFixed(2)} | L5: ${levelDetails.L5.toFixed(2)}<br>
        <strong>能力域综合分(0~1):</strong> 资源:${domainScores['资源'].toFixed(2)} 应用:${domainScores['应用'].toFixed(2)} 管理:${domainScores['管理'].toFixed(2)} 效益:${domainScores['效益'].toFixed(2)}</div>`;
        document.getElementById('scoreDetail').innerHTML = detailHtml;
        let rec = "";
        if (grade === "L1 起始级") rec = "建议加强人工智能资源投入，启动试点场景，建立数据管理基础。";
        else if (grade === "L2 应用级") rec = "可扩展部门级应用，建设统一平台，完善人工智能战略与管理制度。";
        else if (grade === "L3 协同级") rec = "强化跨部门协同与平台能力，推进全企业智能化集成，量化效益指标。";
        else if (grade === "L4 企业级") rec = "持续优化全企业智能化能力，输出最佳实践，引领产业链升级。";
        else rec = "已达到推广级，建议带动上下游生态共享能力，主导标准制定，提升行业影响力。";
        document.getElementById('recommend').innerHTML = `<i class="fas fa-lightbulb"></i> 改进建议: ${rec}`;
        window.scrollTo({ top: document.getElementById('resultArea').offsetTop - 20, behavior: 'smooth' });
    }

    buildSurvey();
    document.getElementById('evaluateBtn').addEventListener('click', showResults);
</script>
